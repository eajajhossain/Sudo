<!doctype html>
<html><head><meta charset="utf-8"><title>Framed Apply</title>
<style>html,body{height:100%;margin:0;overflow:hidden}iframe{position:absolute;top:120px;left:40px;width:700px;height:420px;border:2px solid #444}</style>
</head><body>
<p>Before applying, watch the training material.</p>
<iframe id="apply"></iframe>
<script>
  // Load the form from a different origin (localhost vs 127.0.0.1), like a real embedded form.
  const here = new URL(location.href);
  here.hostname = here.hostname === "127.0.0.1" ? "localhost" : "127.0.0.1";
  here.pathname = here.pathname.replace("framed.html", "frame_form.html");
  document.getElementById("apply").src = here.href;
</script>
</body></html>
