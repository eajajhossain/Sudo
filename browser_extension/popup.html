<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SUDO Browser Link</title>
<style>
  body { width: 260px; margin: 0; padding: 14px; background: #0b0c0e; color: #e8eaed; font: 13px "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; color: #9aa1ab; margin-bottom: 8px; }
  input { display: block; width: 100%; box-sizing: border-box; margin-top: 3px; padding: 6px 8px; background: #121417; color: inherit; border: 1px solid #262a30; border-radius: 5px; }
  button { padding: 6px 14px; background: #c6f135; color: #11140a; font-weight: 600; border: 0; border-radius: 5px; cursor: pointer; }
  #state { margin-top: 10px; color: #9aa1ab; }
</style>
</head>
<body>
<h1>SUDO Browser Link</h1>
<form id="form">
  <label>Pairing code (from SUDO Settings) <input id="code" type="text" autocomplete="off" spellcheck="false" required></label>
  <label>Port <input id="port" type="number" value="8765" required></label>
  <button>Connect</button>
</form>
<p id="state" role="status"></p>
<script src="popup.js"></script>
</body>
</html>
